name: Verify template
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: app
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://app:ci-only-password@localhost:5432/app
      COMPOSE_DATABASE_URL: postgres://app:ci-only-password@postgres:5432/app
      APP_ORIGIN: http://localhost:3100
      BOOTSTRAP_ADMIN_ACCOUNT: admin
      BOOTSTRAP_ADMIN_PASSWORD: ci-only-password-8791
      E2E_USERNAME: admin
      E2E_PASSWORD: ci-only-password-8791
      POSTGRES_TOOLS: docker
      POSTGRES_TOOL_IMAGE: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Select checks and record prior verification
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-plan.mjs
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        if: steps.plan.outputs.scope != 'reuse'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: steps.plan.outputs.scope != 'reuse'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.plan.outputs.scope != 'reuse'
      - run: pnpm hooks:install
        if: steps.plan.outputs.scope != 'reuse'
      - name: Check release metadata
        if: steps.plan.outputs.scope == 'version'
        run: |
          pnpm format:check
          pnpm version:check
          pnpm docs:check
      - name: Check engineering changes
        if: steps.plan.outputs.scope == 'engineering'
        run: |
          pnpm format:check
          pnpm lint
          pnpm duplication:check
          pnpm dependency:check
          pnpm boundary:check
          pnpm conventions:check
          pnpm supply-chain:check
          pnpm contract:check
          pnpm typecheck
          pnpm migration:check
          pnpm version:check
          pnpm docs:check
          pnpm test:tools
      - run: pnpm exec playwright install --with-deps chromium
        if: steps.plan.outputs.scope == 'full'
      - run: pnpm db:migrate
        if: steps.plan.outputs.scope == 'full'
      - run: pnpm admin:bootstrap
        if: steps.plan.outputs.scope == 'full'
      - run: pnpm pr:verify --full
        if: steps.plan.outputs.scope == 'full'
      - run: pnpm test:capacity
        if: steps.plan.outputs.scope == 'full'
      - run: pnpm test:backup
        if: steps.plan.outputs.scope == 'full'
      - run: pnpm test:app-backup
        if: steps.plan.outputs.scope == 'full'
      - run: docker compose --env-file .env.example -f deploy/compose/docker-compose.yml --profile '*' config --quiet
        if: steps.plan.outputs.scope == 'full'
      - run: pnpm test:containers
        if: steps.plan.outputs.scope == 'full'
      - run: pnpm test:cold-start
        if: steps.plan.outputs.scope == 'full'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: verification-evidence
          path: |
            artifacts/
            .verification/verify-*/
            .verification/containers/
            .verification/app/
            .verification/pstack-x/
            .verification/async-recovery/
            .verification/kafka-security/
            .verification/template-implementation/
            .verification/cold-start/
          include-hidden-files: true
          if-no-files-found: error
