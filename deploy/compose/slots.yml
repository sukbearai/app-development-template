# Infrastructure and volumes are provisioned independently from release slots.
x-app: &app
  image: ${PSTACK_WEB_IMAGE:?Use release:plan to obtain a verified digest reference}
  networks: [shared]
  environment: &environment
    NODE_ENV: production
    APP_NAME: ${APP_NAME:-Pstack App}
    OTEL_ENABLED: ${OTEL_ENABLED:-false}
    OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-pstack-web}
    OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://localhost:4318/v1/traces}
    OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
    OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1}
    APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3100}
    DATABASE_URL: ${COMPOSE_DATABASE_URL:?Run pnpm local:up or set an encoded internal PostgreSQL URL}
    SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-pstack_session}
    SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-86400}
    SERVICE_TOKEN: ${SERVICE_TOKEN:-}
    METRICS_TOKEN: ${METRICS_TOKEN:-}
    RATE_LIMIT_DRIVER: ${RATE_LIMIT_DRIVER:-memory}
    LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-20}
    LOGIN_RATE_LIMIT_GLOBAL_MAX: ${LOGIN_RATE_LIMIT_GLOBAL_MAX:-200}
    WEB_SHUTDOWN_TIMEOUT_MS: ${WEB_SHUTDOWN_TIMEOUT_MS:-30000}
    WEB_REPLICAS: ${WEB_REPLICAS:?The executor supplies the overlapping replica count}
    OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-5}
    ASYNC_RUNTIME_PUBLISHER: &worker-publisher kafka
    ASYNC_RUNTIME_TOPICS: ${ASYNC_RUNTIME_TOPICS:-app.tasks,telemetry.events,files.events,audit.events}
    LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-60}
    LOGIN_RATE_LIMIT_MEMORY_MAX_KEYS: ${LOGIN_RATE_LIMIT_MEMORY_MAX_KEYS:-5000}
    REDIS_URL: ${REDIS_URL:?Set the shared Redis URL}
    KAFKA_BROKERS: ${COMPOSE_KAFKA_BROKERS:-kafka:9092}
    KAFKA_CLIENT_ID: ${KAFKA_CLIENT_ID:-app-template-worker}
    KAFKA_CONSUMER_GROUP_ID: ${KAFKA_CONSUMER_GROUP_ID:-app-template-worker-consumer}
    KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
    KAFKA_SSL_CA_FILE: ${KAFKA_SSL_CA_FILE:-}
    KAFKA_SSL_CERT_FILE: ${KAFKA_SSL_CERT_FILE:-}
    KAFKA_SSL_KEY_FILE: ${KAFKA_SSL_KEY_FILE:-}
    KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-}
    KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-}
    KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:-}
    UPLOAD_STORAGE_DRIVER: ${UPLOAD_STORAGE_DRIVER:-local}
    UPLOAD_STORAGE_DIR: /app/uploads
    UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-10485760}
    UPLOAD_MAX_CONCURRENT: ${UPLOAD_MAX_CONCURRENT:-2}
    UPLOAD_STORAGE_SHARED: ${UPLOAD_STORAGE_SHARED:-false}
    OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-http://minio:9000}
    OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
    OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-}
    OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-}
    OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-app-files}
    OBJECT_STORAGE_FORCE_PATH_STYLE: ${OBJECT_STORAGE_FORCE_PATH_STYLE:-true}
  init: true
  restart: unless-stopped

services:
  migrate:
    <<: *app
    restart: "no"
    environment:
      <<: *environment
      PGOPTIONS: "-c lock_timeout=1000 -c statement_timeout=120000"
    command: [pnpm, --filter, "@pstack/database", "db:migrate"]
  web:
    <<: *app
    stop_grace_period: ${WEB_STOP_GRACE_PERIOD:-40s}
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/api/system/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
  worker:
    <<: *app
    image: ${PSTACK_WORKER_IMAGE:?Use release:plan to obtain a verified digest reference}
    environment:
      <<: *environment
      OUTBOX_PUBLISHER: *worker-publisher
      WORKER_HEARTBEAT_PATH: /tmp/pstack-worker-heartbeat.json
      WORKER_SHUTDOWN_TIMEOUT_MS: ${WORKER_SHUTDOWN_TIMEOUT_MS:-30000}
    stop_grace_period: ${WORKER_STOP_GRACE_PERIOD:-40s}
    healthcheck:
      test: [CMD, pnpm, --filter, "@pstack/worker", exec, tsx, src/index.ts, health, --live]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 30s
networks:
  shared:
    external: true
    name: ${PSTACK_SHARED_NETWORK:?Set the target infrastructure network}
volumes:
  uploads:
    external: true
    name: ${PSTACK_UPLOAD_VOLUME:?Set the existing shared upload volume}
